<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Ejercicios - Superarse</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <link rel="stylesheet" href="../styles/dropdown.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/png" href="../images/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <main class="main">

    <!-- Contenido principal -->
    <section class="admin-content">
      <div class="container">
        <h1 class="admin-title">Administrar Ejercicios</h1>
        
        <!-- Barra de acciones -->
        <div class="action-bar">
          <div class="action-buttons">
            <button class="btn-add" onclick="agregarEjercicio()">
              <i class="fas fa-plus"></i>
              Agregar Ejercicio
            </button>
          </div>
          
          <div class="search-section">
            <div class="search-container">
              <input type="text" id="searchEjercicios" placeholder="Buscar ejercicios..." class="search-input">
              <button class="search-btn" onclick="buscarEjercicios()">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Tabla de ejercicios -->
        <div class="table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Grupo Muscular</th>
                <th>Nivel</th>
                <th>Imagen</th>
                <th>Video</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="ejerciciosTableBody">
              <!-- Los datos se cargan dinamicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script src="../javascript/header.js"></script>
  <script src="../javascript/dropdown.js"></script>
  <script src="../javascript/admin.js"></script>
  <script src="../javascript/ejercicios-admin.js"></script>
</body>

</html>
