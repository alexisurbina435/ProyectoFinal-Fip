<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Administrador - Superarse</title>
  <link rel="stylesheet" href="../../styles/styles.css">
  <link rel="stylesheet" href="../../styles/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/png" href="../../images/logo.png">
</head>

<body>
  <main class="main">

    <!-- Header -->
    <header class="header">
      <nav class="navigation admin-nav">
        <a href="index.html"><img src="../../images/logo-sinfondo.png" class="logo" alt="logo"></a>
        <ul class="nav-list admin-nav-list">
          <li class="nav-item"><a href="index.html" class="nav-links" aria-label="Inicio">Inicio</a></li>
          <li class="nav-item"><a href="perfil.html" class="nav-links" aria-label="Perfil">Perfil</a></li>
        </ul>

        <!-- Icono de administracion -->
        <div class="icons-container">
          <div class="admin-icon">
            <svg width="40" height="40" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fillRule="evenodd" clipRule="evenodd" 
                d="M9.414 1.586C9.02 1.192 8.48 1 7.93 1C7.38 1 6.84 1.192 6.446 1.586L5.586 2.446C5.421 2.611 5.172 2.671 4.95 2.6L3.778 2.222C3.348 2.085 2.885 2.236 2.586 2.586C2.236 2.885 2.085 3.348 2.222 3.778L2.6 4.95C2.671 5.172 2.611 5.421 2.446 5.586L1.586 6.446C1.192 6.84 1 7.38 1 7.93C1 8.48 1.192 9.02 1.586 9.414L2.446 10.274C2.611 10.439 2.671 10.688 2.6 10.91L2.222 12.082C2.085 12.512 2.236 12.975 2.586 13.274C2.885 13.624 3.348 13.775 3.778 13.638L4.95 13.26C5.172 13.189 5.421 13.249 5.586 13.414L6.446 14.274C6.84 14.668 7.38 14.86 7.93 14.86C8.48 14.86 9.02 14.668 9.414 14.274L10.274 13.414C10.439 13.249 10.688 13.189 10.91 13.26L12.082 13.638C12.512 13.775 12.975 13.624 13.274 13.274C13.624 12.975 13.775 12.512 13.638 12.082L13.26 10.91C13.189 10.688 13.249 10.439 13.414 10.274L14.274 9.414C14.668 9.02 14.86 8.48 14.86 7.93C14.86 7.38 14.668 6.84 14.274 6.446L13.414 5.586C13.249 5.421 13.189 5.172 13.26 4.95L13.638 3.778C13.775 3.348 13.624 2.885 13.274 2.586C12.975 2.236 12.512 2.085 12.082 2.222L10.91 2.6C10.688 2.671 10.439 2.611 10.274 2.446L9.414 1.586ZM7.93 10.5C6.62 10.5 5.5 9.38 5.5 8.07C5.5 6.76 6.62 5.64 7.93 5.64C9.24 5.64 10.36 6.76 10.36 8.07C10.36 9.38 9.24 10.5 7.93 10.5Z" 
                stroke="#EE5F0D" fill="none" stroke-width="1"/>
            </svg>            
          </div>
        </div>
      </nav>
    </header>
    <!-- Fin Header -->

    <!-- Contenido principal -->
    <section class="admin-content">
      <div class="container">
        <h1 class="admin-title">Perfil de Administrador</h1>
        
        <div class="profile-form">
          <form id="profileForm">
            <div class="form-group">
              <label for="nombre">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required>
            </div>

            <div class="form-group">
              <label for="correo">Correo electrónico</label>
              <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electrónico" required>
            </div>

            <div class="form-group">
              <label for="telefono">Teléfono</label>
              <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su número de teléfono" required>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-save">Guardar Cambios</button>
              <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <script src="../../javascript/admin.js"></script>
</body>

</html>
