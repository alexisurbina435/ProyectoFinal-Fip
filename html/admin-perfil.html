<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Administrador - Superarse</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <link rel="stylesheet" href="../styles/dropdown.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/png" href="../images/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <main class="main">

    <!-- Contenido principal -->
    <section class="admin-content">
      <div class="container">
        <h1 class="admin-title">Perfil de Administrador</h1>
        
        <div class="profile-form">
          <form id="profileForm">
            <div class="form-group">
              <label for="nombre">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required>
            </div>

            <div class="form-group">
              <label for="correo">Correo electrónico</label>
              <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electrónico" required>
            </div>

            <div class="form-group">
              <label for="telefono">Teléfono</label>
              <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su número de teléfono" required>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-save">Guardar Cambios</button>
              <button type="button" class="btn-cancel" onclick="window.location.href='admin-index.html'">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <script src="../javascript/header.js"></script>
  <script src="../javascript/dropdown.js"></script>
  <script src="../javascript/admin.js"></script>
</body>

</html>
