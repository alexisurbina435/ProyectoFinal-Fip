<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Superarse</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/admin.css">
  <link rel="stylesheet" href="../styles/dropdown.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/png" href="../images/logo.png">
</head>

<body>
  <main class="main">

    <!-- Contenido principal -->
    <section class="admin-content">
      <div class="container">
        <h1 class="admin-title">Panel de Administración</h1>
        
        <div class="admin-options">
          <div class="admin-option">
            <div class="option-content">
              <h3>Administrar Clientes</h3>
              <p>Gestionar información de clientes y usuarios</p>
            </div>
            <div class="option-arrow">
              <i class="fas fa-arrow-right"></i>
            </div>
          </div>

          <div class="admin-option">
            <div class="option-content">
              <h3>Administrar Rutinas</h3>
              <p>Crear y modificar rutinas de entrenamiento</p>
            </div>
            <div class="option-arrow">
              <i class="fas fa-arrow-right"></i>
            </div>
          </div>

          <div class="admin-option">
            <div class="option-content">
              <h3>Administrar Ejercicios</h3>
              <p>Gestionar catálogo de ejercicios</p>
            </div>
            <div class="option-arrow">
              <i class="fas fa-arrow-right"></i>
            </div>
          </div>

          <div class="admin-option">
            <div class="option-content">
              <h3>Administrar Tienda</h3>
              <p>Gestionar productos y ventas</p>
            </div>
            <div class="option-arrow">
              <i class="fas fa-arrow-right"></i>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="../javascript/header.js"></script>
  <script src="../javascript/dropdown.js"></script>
  <script src="../javascript/admin.js"></script>
</body>

</html>
